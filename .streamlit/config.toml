[theme]
base = "light"
primaryColor = "#012869"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#1F2937"

# Tipografia corporativa. Este `font` alimenta o bodyFont do tema, que é a
# fonte desenhada no canvas dos dataframes — o glide-data-grid ignora o
# font-family vindo do Styler, então esta linha e FONTE_TABELA em
# components/componentes.py precisam apontar para a mesma família.
# Manrope e Inter são SIL OFL e ficam auto-hospedadas em assets/fonts
# (embutidas em base64 pelo app, sem depender de CDN).
font = "Manrope, Inter, sans-serif"

[server]
enableStaticServing = false
headless = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true