# Copie este arquivo para .streamlit/secrets.toml e preencha os valores.
# NUNCA versione o arquivo secrets.toml preenchido.

# ── Conta de serviço do Google (leitura da aba lista_ativos) ──
# Cole aqui o conteúdo do JSON da Service Account e compartilhe a
# planilha de ativos com o e-mail (client_email) dessa conta.
[gcp_service_account]
type = "service_account"
project_id = "seu-projeto"
private_key_id = "xxxxxxxx"
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = "conta-servico@seu-projeto.iam.gserviceaccount.com"
client_id = "000000000000000000000"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/conta-servico%40seu-projeto.iam.gserviceaccount.com"

# ── (Opcional) ID da planilha de ativos ───────────────────────
# Sem este valor, o ID padrão embutido no código é usado.
# SHEET_ID = "1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# ── (Opcional) Kit web da fonte Oscine (Adobe Fonts) ──────────
[tipografia]
# fonte_hero_url = "https://use.typekit.net/xxxxxxx.css"

# ── (Opcional) Feriados extras no formato AAAA-MM-DD=Nome ─────
[calendario]
# feriados_extra = "2026-01-20=Feriado municipal"
