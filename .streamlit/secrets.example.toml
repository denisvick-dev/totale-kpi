# ============================================
# EXEMPLO - Renomeie para secrets.toml e preencha
# NÃO COMMITAR o secrets.toml real!
# ============================================

[gcp_service_account]
type = "service_account"
project_id = "seu-projeto-id"
private_key_id = "sua-private-key-id"
private_key = "-----BEGIN PRIVATE KEY-----\nSUA_CHAVE_AQUI\n-----END PRIVATE KEY-----\n"
client_email = "seu-email@seu-projeto.iam.gserviceaccount.com"
client_id = "seu-client-id"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/..."

# ============================================
# USUÁRIOS DO SISTEMA
# ============================================
[usuarios.admin]
senha = "senha_forte_aqui"
nome = "Administrador"
role = "admin"
bases = []

[usuarios.supervisor01]
senha = "outra_senha"
nome = "Nome do Supervisor"
role = "supervisor"
bases = ["BASE01", "BASE02"]

[usuarios.operador01]
senha = "senha_operador"
nome = "Nome do Operador"
role = "operador"
bases = ["BASE01"]

[usuarios.leitura01]
senha = "senha_leitura"
nome = "Usuário Leitura"
role = "leitura"
bases = []